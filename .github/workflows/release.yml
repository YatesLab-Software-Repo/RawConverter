# Builds the Windows installer and publishes it as a GitHub Release.
#
#   Release:  git tag 1.2.1 && git push origin 1.2.1   (a "v" prefix, e.g. v1.2.1, also works)
#   Dry run:  Actions tab -> "Release" -> Run workflow; the installer is kept as a workflow artifact
#             and no release is created.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*', 'v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload its assets

jobs:
  windows-installer:
    runs-on: ubuntu-latest   # Inno Setup runs in Docker via build-installer.sh, as it does locally
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # Unit tests; regression cases skip themselves because test_data/ is not in the repository.
      - name: Test
        run: dotnet test RawConverter.sln -c Release

      - name: Build installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/windows/build-installer.sh

      - name: Zip portable build
        run: |
          cd out
          zip -qr "RawConverter-${{ steps.version.outputs.version }}-win-x64.zip" RawConverter-win-x64 \
            -x '*.so' '*.pdb'

      - uses: actions/upload-artifact@v4
        with:
          name: RawConverter-${{ steps.version.outputs.version }}-win-x64
          path: |
            out/RawConverter-*-win-x64-setup.exe
            out/RawConverter-*-win-x64.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: RawConverter ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            out/RawConverter-*-win-x64-setup.exe
            out/RawConverter-*-win-x64.zip
