# Builds the Windows installer and the Linux packages, and publishes them as a GitHub Release.
#
#   Release:  git tag 1.2.1 && git push origin 1.2.1   (a "v" prefix, e.g. v1.2.1, also works)
#   Dry run:  Actions tab -> "Release" -> Run workflow; the files are kept as workflow artifacts
#             and no release is created.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*', 'v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  # Unit tests; regression cases skip themselves because test_data/ is not in the repository.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test RawConverter.sln -c Release

  windows:
    needs: version
    runs-on: ubuntu-latest   # Inno Setup runs in Docker via build-installer.sh, as it does locally
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build installer
        run: packaging/windows/build-installer.sh
      - name: Zip portable build
        run: |
          cd out
          zip -qr "RawConverter-$VERSION-win-x64.zip" RawConverter-win-x64 -x '*.so' '*.pdb'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/RawConverter-*-win-x64-setup.exe
            out/RawConverter-*-win-x64.zip

  linux:
    needs: version
    runs-on: ubuntu-latest   # nFPM runs in Docker via build-packages.sh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build .deb, .rpm, Arch package and tarball
        run: packaging/linux/build-packages.sh
      - name: Install and run the packages on Ubuntu, Fedora and Arch
        run: |
          docker run --rm -v "$PWD/out:/pkgs:ro" ubuntu:24.04 bash -c \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends /pkgs/rawconverter_*.deb && rawconverter --help | head -1'
          docker run --rm -v "$PWD/out:/pkgs:ro" fedora:latest bash -c \
            'dnf install -q -y --setopt=install_weak_deps=False /pkgs/rawconverter-*.rpm && rawconverter --help | head -1'
          docker run --rm -v "$PWD/out:/pkgs:ro" archlinux:latest bash -c \
            'pacman -Sy --noconfirm >/dev/null && pacman -U --noconfirm /pkgs/rawconverter-*.pkg.tar.zst >/dev/null && rawconverter --help | head -1'
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/rawconverter_*.deb
            out/rawconverter-*.rpm
            out/rawconverter-*.pkg.tar.zst
            out/RawConverter-*-linux-x64.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: [version, test, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: RawConverter ${{ needs.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: dist/*
