# Tests, then builds the Windows installer and portable zip and the Linux packages for one commit and version,
# and uploads them as the workflow artifacts "windows" and "linux". Called by release.yml and nightly.yml.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        required: true
        type: string
      version:
        description: Version stamped into the binaries and packages (e.g. 1.3.0 or 1.3.0-nightly.20261112.42)
        required: true
        type: string

jobs:
  # Unit tests; regression cases skip themselves because test_data/ is not in the repository.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test RawConverter.sln -c Release

  windows:
    # A native Inno Setup on Windows: the Wine in the Inno Setup Docker image (used for local builds on Linux) does not
    # start on GitHub's Ubuntu runners ("wineserver: socket: Function not implemented").
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # Git Bash, so build-installer.sh runs as it does on Linux
    env:
      VERSION: ${{ inputs.version }}
      ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path $env:ISCC)) { choco install innosetup --no-progress -y }
          & $env:ISCC /? | Select-Object -First 1
      # on failure, the end of the output becomes an error annotation (readable without signing in to GitHub);
      - name: Build installer
        run: |
          set -o pipefail
          packaging/windows/build-installer.sh 2>&1 | tee build.log || {
            echo "::error title=build-installer.sh failed::$(tail -n 40 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
            exit 1
          }
      - name: Zip portable build
        run: |
          cd out
          7z a -tzip -bso0 "RawConverter-$VERSION-win-x64.zip" RawConverter-win-x64 '-xr!*.so' '-xr!*.pdb'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/RawConverter-*-win-x64-setup.exe
            out/RawConverter-*-win-x64.zip

  linux:
    runs-on: ubuntu-latest   # nFPM runs in Docker via build-packages.sh
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build .deb, .rpm, Arch package and tarball
        run: |
          set -o pipefail
          packaging/linux/build-packages.sh 2>&1 | tee build.log || {
            echo "::error title=build-packages.sh failed::$(tail -n 40 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
            exit 1
          }
      - name: Install and run the packages on Ubuntu, Fedora and Arch
        run: |
          docker run --rm -v "$PWD/out:/pkgs:ro" ubuntu:24.04 bash -c \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends /pkgs/rawconverter_*.deb && rawconverter --help | head -1'
          docker run --rm -v "$PWD/out:/pkgs:ro" fedora:latest bash -c \
            'dnf install -q -y --setopt=install_weak_deps=False /pkgs/rawconverter-*.rpm && rawconverter --help | head -1'
          docker run --rm -v "$PWD/out:/pkgs:ro" archlinux:latest bash -c \
            'pacman -Sy --noconfirm >/dev/null && pacman -U --noconfirm /pkgs/rawconverter-*.pkg.tar.zst >/dev/null && rawconverter --help | head -1'
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/rawconverter_*.deb
            out/rawconverter-*.rpm
            out/rawconverter-*.pkg.tar.zst
            out/RawConverter-*-linux-x64.tar.gz
