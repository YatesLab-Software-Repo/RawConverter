# Nightly builds: every push to the branches below, and every pushed tag that is not a version tag, is built as
# <version>-nightly.<yyyymmdd>.<run> and replaces the rolling "nightly" pre-release on GitHub
# (https://github.com/YatesLab-Software-Repo/RawConverter/releases/tag/nightly).
# Nightly installs of RawConverter check that release and update themselves (see README, "Update check").
# Version tags (1.3.0, v1.3.0) make full releases through release.yml instead.
name: Nightly

on:
  push:
    branches:
      - unify-net10   # every push to these branches updates the nightly; add or replace branches here
    tags:
      - '*'           # every pushed tag (e.g. "test-feature-x"), except version tags and the nightly tag itself:
      - '![0-9]*'
      - '!v[0-9]*'
      - '!nightly'
  workflow_dispatch:   # Actions -> Nightly -> Run workflow (for a branch, once this file is on main)
    inputs:
      force:
        description: Build even if this commit is already the nightly
        type: boolean
        default: false

# a newer push cancels the build of an older one, so the nightly is always the latest push;
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # the pushed commit (or the tagged one)
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git rev-parse HEAD)
          last=$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          build=true
          if [ "$sha" = "$last" ] && [ "$FORCE" != true ]; then
            build=false
            echo "$sha is already the nightly; skipping."
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Commit $sha, version $version, build $build"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # replace the nightly release and its tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          # the title carries the version: the update check reads it from there (the tag is always "nightly");
          gh release create nightly dist/* --prerelease --target "$SHA" --title "RawConverter $VERSION" \
            --notes "Nightly build of \`$GITHUB_REF_NAME\` at $SHA ($(date -u '+%Y-%m-%d %H:%M UTC')). Untested; for trying out new features. Nightly installs update themselves to the next nightly."
